apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-postgres-app-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: observability-postgres-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: internal-developer-platform/observability/prod/postgres
        property: username
    - secretKey: password
      remoteRef:
        key: internal-developer-platform/observability/prod/postgres
        property: password
    - secretKey: database
      remoteRef:
        key: internal-developer-platform/observability/prod/postgres
        property: database
