apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-grafana-admin-external
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: observability-grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: internal-developer-platform/observability/prod/grafana
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: internal-developer-platform/observability/prod/grafana
        property: admin_password
    - secretKey: db-user
      remoteRef:
        key: internal-developer-platform/observability/prod/postgres
        property: username
    - secretKey: db-password
      remoteRef:
        key: internal-developer-platform/observability/prod/postgres
        property: password
    - secretKey: db-name
      remoteRef:
        key: internal-developer-platform/observability/prod/postgres
        property: database
