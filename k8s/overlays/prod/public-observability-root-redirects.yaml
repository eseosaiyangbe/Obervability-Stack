apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-root-redirect
spec:
  redirectRegex:
    regex: ^(https?)://([^/]+)/$
    replacement: ${1}://${2}/graph
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: alertmanager-root-redirect
spec:
  redirectRegex:
    regex: ^(https?)://([^/]+)/$
    replacement: ${1}://${2}/#/alerts
---
