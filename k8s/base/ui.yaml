apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-ui-config
data:
  NODE_ENV: production
  PORT: "3000"
  SITE_NAME: Internal Developer Platform Control Plane
  SITE_URL: http://controlplane.devops.local
  SITE_DESCRIPTION: Shared observability control plane for the Internal Developer Platform workspace
  NEXT_PUBLIC_API_URL: http://controlplane.devops.local/api
  AUTH_MODE: database
  ENABLE_DEMO_LOGIN: "true"
  NEXT_PUBLIC_AUTH_MODE: database
  NEXT_PUBLIC_ENABLE_DEMO_LOGIN: "true"
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_URL: http://grafana:3000
  LOKI_URL: http://loki:3100
  ALERTMANAGER_URL: http://alertmanager:9093
  NODE_EXPORTER_URL: http://node-exporter:9100
  PROMTAIL_URL: http://promtail:9080
  BLACKBOX_EXPORTER_URL: http://blackbox-exporter:9115
  CADVISOR_URL: http://cadvisor:8080
  NODE_EXPORTER_ENABLED: "true"
  CADVISOR_ENABLED: "true"
  NEXT_PUBLIC_PROMETHEUS_BROWSER_URL: http://localhost:9090/graph
  NEXT_PUBLIC_GRAFANA_BROWSER_URL: http://localhost:3000/login
  NEXT_PUBLIC_LOKI_BROWSER_URL: http://localhost:3100/metrics
  NEXT_PUBLIC_ALERTMANAGER_BROWSER_URL: http://localhost:9093/#/alerts
  NEXT_PUBLIC_NODE_EXPORTER_BROWSER_URL: http://localhost:9100
  NEXT_PUBLIC_PROMTAIL_BROWSER_URL: http://localhost:9080/targets
  NEXT_PUBLIC_BLACKBOX_EXPORTER_BROWSER_URL: http://localhost:9115
  NEXT_PUBLIC_CADVISOR_BROWSER_URL: http://localhost:8082/containers/
  NOTIFICATION_STORE_PATH: /app/data/notification-events.json
---
apiVersion: v1
kind: Service
metadata:
  name: devops-monitor-ui
spec:
  selector:
    app.kubernetes.io/name: devops-monitor-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devops-monitor-db-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-monitor-db-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: devops-monitor-db-init:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              node -e '
              const net = require("net");
              const host = process.env.OBSERVABILITY_DB_WAIT_HOST || "observability-postgres-rw";
              const port = Number(process.env.OBSERVABILITY_DB_WAIT_PORT || 5432);
              const timeoutMs = Number(process.env.OBSERVABILITY_DB_WAIT_TIMEOUT_MS || 180000);
              const intervalMs = Number(process.env.OBSERVABILITY_DB_WAIT_INTERVAL_MS || 2000);
              const deadline = Date.now() + timeoutMs;

              function tryConnect() {
                const socket = net.createConnection({ host, port });
                socket.setTimeout(5000);
                socket.on("connect", () => {
                  console.log(`[db-init] Database reachable at ${host}:${port}`);
                  socket.end();
                  process.exit(0);
                });
                socket.on("timeout", () => socket.destroy(new Error("timeout")));
                socket.on("error", (error) => {
                  socket.destroy();
                  if (Date.now() >= deadline) {
                    console.error(`[db-init] Timed out waiting for ${host}:${port}: ${error.message}`);
                    process.exit(1);
                  }
                  setTimeout(tryConnect, intervalMs);
                });
              }

              tryConnect();
              ' &&
              npx prisma migrate deploy &&
              npm run db:seed
          envFrom:
            - configMapRef:
                name: observability-ui-config
            - secretRef:
                name: observability-ui-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-monitor-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-monitor-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-monitor-ui
    spec:
      containers:
        - name: ui
          image: devops-monitor-ui:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: observability-ui-config
            - secretRef:
                name: observability-ui-secrets
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: data
          emptyDir: {}
