apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-monitor-ui
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: controlplane.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-monitor-ui
                port:
                  number: 3000
---
